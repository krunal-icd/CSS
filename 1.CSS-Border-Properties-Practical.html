<!DOCTYPE html>
<html>
<head>
<style>
/* Base width: 2px for general UI elements */
#example1 > .product-card {
    border: 2px solid #000;
    padding: 16px;
}

/* Thin divider: 1px */
#example1 > .product-card h3 {
    border-bottom: 1px solid #ccc;
    padding-bottom: 8px;
}

/* Thick emphasis: 4px */
#example1 > .product-card.important {
    border: 4px solid #000;
}

#example2 > .product-card {
    border-top: 0;
    border-right: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    border-left: 4px solid #000;
    padding: 16px;
}

#example2 > .product-card {
    border-style: solid;
    border-width: 0 1px 1px 4px; /* Top Right Bottom Left */
    border-color: #ccc #ccc #ccc #000;
    padding: 16px;
}

/* Critical Error */
#example3 > .alert-error {
    border: 2px solid #d9534f;
    padding: 12px;
}

/* Warning */
#example3 > .alert-warning {
    border: 2px dashed #f0ad4e;
    padding: 12px;
}

/* Information */
#example3 > .alert-info {
    border: 2px dotted #5bc0de;
    padding: 12px;
}
</style>
<style data-type="example3"></style>
</head>
<body>
<div id="example1">
    <p>Example 1</p>
    <div class="product-card">
        <h3>Premium Headphones</h3>
        <p>High-quality audio</p>
    </div>
    <div class="product-card important">
        <h3>Premium Headphones</h3>
        <p>High-quality audio</p>
    </div>
</div>
<hr>
<div id="example2">
    <p>Example 2</p>
    <div class="product-card">
        <h3>Premium Headphones</h3>
        <p>High-quality audio</p>
    </div>
</div>
<div id="example3">
    <p>Example 3</p>
    <div class="alert-error">
        <p>Please review your input before submitting</p>
    </div>
    <div class="alert-warning">
        <p>Please review your input before submitting</p>
    </div>
    <div class="alert-info">
        <p>Please review your input before submitting</p>
    </div>
</div>
</body>
</html>
